services:

  api:
    build: .
    image: task-manager-api
    container_name: task-manager-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/task_manager.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - task-manager-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  task-manager-data:
    external: true
    name: task-manager-data